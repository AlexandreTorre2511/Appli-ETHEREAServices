<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#f4f7f6">
<title>ETHEREA Board</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="ETHEREA">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700&family=Manrope:wght@400;500;600;700&display=swap">
<style>
:root{
  --bg:#f4f7f6;--surface:#fff;--soft:#eef3f1;--ink:#10201d;--muted:#5b6b67;--faint:#8a9995;--line:#dde5e2;
  --accent:#0f7a68;--accent-soft:#e3f2ee;--warn:#a86412;--warn-soft:#fbf1e2;--danger:#b4372c;--danger-soft:#fbe9e7;
  --ok:#2c7a4b;--ok-soft:#e6f4ea;--info:#2d5f9a;--info-soft:#e8eff8;
  --r:14px;--shadow:0 1px 2px rgba(16,32,29,.05),0 4px 16px rgba(16,32,29,.05);
  --safe-b:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:"Manrope",system-ui,sans-serif;font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
h1,h2,h3{font-family:"Sora",system-ui,sans-serif;margin:0;letter-spacing:-.01em}
h1{font-size:22px}h2{font-size:17px}h3{font-size:15px}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--accent)}
.hidden{display:none!important}

/* Layout */
.app{display:grid;grid-template-columns:232px 1fr;min-height:100vh}
.side{position:sticky;top:0;height:100vh;padding:22px 14px;border-right:1px solid var(--line);background:var(--surface);display:flex;flex-direction:column;gap:4px}
.brand{display:flex;align-items:center;gap:10px;padding:0 8px 18px}
.brand img{width:34px;height:34px;border-radius:9px}
.brand b{font-family:"Sora";font-size:16px;display:block;line-height:1.1}
.brand small{color:var(--muted);font-size:12px}
.nav{display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:10px;border:0;background:none;cursor:pointer;color:var(--muted);font-weight:600;text-align:left;width:100%}
.nav svg{width:18px;height:18px;flex:none}
.nav:hover{background:var(--soft);color:var(--ink)}
.nav.on{background:var(--accent-soft);color:var(--accent)}
.nav .count{margin-left:auto;background:var(--danger);color:#fff;border-radius:99px;font-size:11px;padding:0 7px;line-height:18px}
.side .spacer{flex:1}
.who{font-size:12px;color:var(--muted);padding:8px 12px}
main{min-width:0;padding:26px clamp(16px,3vw,36px) 60px}
.top{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:18px}
.top h1{margin-right:auto}
.sub{color:var(--muted);font-size:13px;margin-top:2px}
.banner{background:var(--warn-soft);color:var(--warn);border-radius:10px;padding:10px 14px;font-size:13px;margin-bottom:16px}
.tabbar{display:none}

/* Buttons */
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:8px 13px;font-weight:600;cursor:pointer;font-size:14px;white-space:nowrap}
.btn:hover{border-color:#c4d0cc}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.primary:hover{background:#0c6857}
.btn.ghost{border-color:transparent;background:none}
.btn.small{padding:5px 10px;font-size:13px;border-radius:8px}
.btn.danger{color:var(--danger)}
.btn:active{transform:scale(.97)}
.btn svg{width:16px;height:16px}

/* Cards & KPIs */
.grid{display:grid;gap:14px}
.kpis{grid-template-columns:repeat(auto-fill,minmax(190px,1fr))}
.two{grid-template-columns:repeat(auto-fit,minmax(340px,1fr))}
@media (min-width:1100px){.kpis.k6{grid-template-columns:repeat(3,1fr)}}
@media (min-width:1500px){.kpis.k6{grid-template-columns:repeat(6,1fr)}}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px 18px;box-shadow:var(--shadow);min-width:0}
.card h2{margin-bottom:12px}
.card .head{display:flex;align-items:center;gap:8px;margin-bottom:12px}
.card .head h2{margin:0;margin-right:auto}
.kpi .label{color:var(--muted);font-size:13px;font-weight:600}
.kpi .value{font-family:"Sora";font-size:26px;font-weight:700;font-variant-numeric:tabular-nums;margin-top:4px;line-height:1.2}
.kpi .hint{color:var(--faint);font-size:12px;margin-top:2px}
.kpi.alert .value{color:var(--danger)}
.kpi.good .value{color:var(--ok)}
.progress{height:8px;background:var(--soft);border-radius:99px;overflow:hidden;margin-top:10px}
.progress i{display:block;height:100%;background:var(--accent);border-radius:99px}
.section{margin-top:22px}

/* Lists */
.rows{display:flex;flex-direction:column}
.row{display:flex;align-items:center;gap:12px;padding:11px 2px;border-top:1px solid var(--line);cursor:pointer}
.row:first-child{border-top:0}
.row:hover .t{color:var(--accent)}
.row .main{min-width:0;flex:1}
.row .t{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .s{color:var(--muted);font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .amt{font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap}
.date{flex:none;width:46px;text-align:center;border-radius:10px;background:var(--soft);padding:4px 0;line-height:1.15}
.date b{display:block;font-family:"Sora";font-size:17px}
.date span{font-size:11px;color:var(--muted);text-transform:uppercase;font-weight:700}
.empty{color:var(--faint);font-size:14px;padding:12px 2px}
.pill{display:inline-block;border-radius:99px;padding:1px 9px;font-size:12px;font-weight:700;white-space:nowrap;background:var(--soft);color:var(--muted)}
.pill.ok{background:var(--ok-soft);color:var(--ok)}
.pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.danger{background:var(--danger-soft);color:var(--danger)}
.pill.info{background:var(--info-soft);color:var(--info)}
.pill.accent{background:var(--accent-soft);color:var(--accent)}

/* Table */
.tablewrap{overflow-x:auto;margin:0 -18px;padding:0 18px}
table{width:100%;border-collapse:collapse;font-size:14px}
th{text-align:left;color:var(--muted);font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.03em;padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:10px;border-bottom:1px solid var(--line);vertical-align:middle}
tr.click{cursor:pointer}
tr.click:hover td{background:#fafcfb}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}

/* Toolbar */
.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
.seg{display:inline-flex;background:var(--soft);border-radius:10px;padding:3px}
.seg button{border:0;background:none;padding:6px 12px;border-radius:8px;font-weight:600;color:var(--muted);cursor:pointer;font-size:14px}
.seg button.on{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}
.search{flex:1;min-width:180px;max-width:340px;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:8px 12px}

/* Calendar */
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:1px;background:var(--line);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.cal .dow{background:var(--soft);font-size:12px;font-weight:700;color:var(--muted);padding:6px;text-align:center}
.cal .day{background:var(--surface);min-height:92px;padding:5px;font-size:12px}
.cal .day.out{background:#fafbfb;color:var(--faint)}
.cal .day.today .n{background:var(--accent);color:#fff;border-radius:99px;padding:0 6px}
.cal .n{font-weight:700;display:inline-block;margin-bottom:3px}
.cal .ev{display:block;border-radius:6px;padding:2px 5px;margin-bottom:2px;cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;background:var(--info-soft);color:var(--info);font-weight:600}
.cal .ev.realisee{background:var(--ok-soft);color:var(--ok)}
.cal .ev.annulee,.cal .ev.reportee{background:var(--soft);color:var(--faint);text-decoration:line-through}

/* Chart */
.bars{display:flex;align-items:flex-end;gap:6px;height:150px;padding-top:8px}
.bars .b{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;height:100%;justify-content:flex-end;min-width:0}
.bars .b i{display:block;width:100%;max-width:34px;background:var(--accent);border-radius:6px 6px 2px 2px;min-height:2px}
.bars .b.cur i{background:#0b5c4e}
.bars .b span{font-size:11px;color:var(--muted)}
.bars .b em{font-style:normal;font-size:10px;color:var(--faint);font-variant-numeric:tabular-nums;white-space:nowrap}
.split{display:flex;flex-direction:column;gap:9px}
.split .l{display:flex;justify-content:space-between;font-size:13px;margin-bottom:3px}
.split .l b{font-variant-numeric:tabular-nums}

/* Modal / drawer */
.overlay{position:fixed;inset:0;background:rgba(16,32,29,.28);display:flex;justify-content:flex-end;z-index:50;animation:fade .15s}
.drawer{width:min(560px,100%);height:100%;background:var(--surface);overflow-y:auto;padding:22px 22px calc(30px + var(--safe-b));box-shadow:-8px 0 30px rgba(0,0,0,.08);animation:slide .18s ease-out}
.drawer .dh{display:flex;align-items:flex-start;gap:10px;margin-bottom:16px}
.drawer .dh h2{margin-right:auto;font-size:19px}
@keyframes fade{from{opacity:0}}
@keyframes slide{from{transform:translateX(24px);opacity:.6}}
.form{display:grid;grid-template-columns:1fr 1fr;gap:12px 14px}
.form .full{grid-column:1/-1}
.field label{display:block;font-size:12px;font-weight:700;color:var(--muted);margin-bottom:4px}
.field input,.field select,.field textarea{width:100%;border:1px solid var(--line);border-radius:9px;padding:8px 10px;background:var(--surface)}
.field textarea{min-height:76px;resize:vertical}
.field input:focus,.field select:focus,.field textarea:focus,.search:focus{outline:2px solid var(--accent-soft);border-color:var(--accent)}
.field.check{display:flex;align-items:center;gap:8px}
.field.check input{width:auto}
.field.check label{margin:0;font-size:14px;color:var(--ink);font-weight:600}
.actions{display:flex;gap:8px;margin-top:18px;flex-wrap:wrap}
.actions .grow{flex:1}
.kv{display:grid;grid-template-columns:130px 1fr;gap:6px 12px;font-size:14px;margin-bottom:14px}
.kv dt{color:var(--muted)}
.kv dd{margin:0;overflow-wrap:anywhere}
.toast{position:fixed;left:50%;bottom:calc(84px + var(--safe-b));transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 16px;border-radius:10px;font-size:14px;z-index:60;box-shadow:var(--shadow);animation:fade .2s}

/* Login */
.login{min-height:100vh;display:grid;place-items:center;padding:20px}
.login .card{width:min(380px,100%);padding:28px}
.login img{width:52px;height:52px;border-radius:12px;margin-bottom:14px}
.login .field{margin-top:12px}
.login .btn{width:100%;justify-content:center;margin-top:14px}
.err{color:var(--danger);font-size:13px;margin-top:10px}

@media (max-width:860px){
  .app{grid-template-columns:1fr}
  .side{display:none}
  main{padding:18px 14px calc(96px + var(--safe-b))}
  .tabbar{display:flex;position:fixed;left:0;right:0;bottom:0;background:rgba(255,255,255,.96);backdrop-filter:blur(10px);border-top:1px solid var(--line);padding:6px 4px calc(6px + var(--safe-b));z-index:40}
  .tabbar button{flex:1;border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;font-weight:600;color:var(--muted);padding:4px 0;position:relative;min-height:46px}
  .tabbar button svg{width:22px;height:22px}
  .tabbar button.on{color:var(--accent)}
  .tabbar .count{position:absolute;top:0;right:calc(50% - 20px);background:var(--danger);color:#fff;border-radius:99px;font-size:10px;padding:0 5px;line-height:15px}
  .form{grid-template-columns:1fr}
  .two{grid-template-columns:1fr}
  .kpis{grid-template-columns:1fr 1fr}
  .kpi .value{font-size:21px}
  .cal .day{min-height:64px;padding:3px}
  .cal .ev{font-size:10px;padding:1px 3px}
  .hide-m{display:none}
  .drawer{padding:18px 16px calc(30px + var(--safe-b))}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
</head>
<body>
<div id="root"></div>
<div id="drawer"></div>
<script src="config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="app.js"></script>
</body>
</html>
